stages:
  - display_variables
  - integration_test

display_variables:
  stage: display_variables
  rules:
    - when: manual
  script:
    - echo "TERMGIT_TRIGGER_BRANCH=$TERMGIT_TRIGGER_BRANCH"
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_MERGE_REQUEST_SOURCE_BRANCH_NAME=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - echo "CS_INPUT_FORMAT=$CS_INPUT_FORMAT"
    - echo "VS_INPUT_FORMAT=$VS_INPUT_FORMAT"

integration_test_branch:
  stage: integration_test
  rules:
    - if: $CI_COMMIT_BRANCH
  variables:
    MALAC_CT_BRANCH: $CI_COMMIT_BRANCH
    CS_INPUT_FORMAT: $CS_INPUT_FORMAT
    VS_INPUT_FORMAT: $VS_INPUT_FORMAT
  trigger:
    project: elga-gmbh/termgit-dev
    branch: $TERMGIT_TRIGGER_BRANCH
    strategy: depend

integration_test_merge_request:
  stage: integration_test
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  variables:
    MALAC_CT_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    CS_INPUT_FORMAT: $CS_INPUT_FORMAT
    VS_INPUT_FORMAT: $VS_INPUT_FORMAT
  trigger:
    project: elga-gmbh/termgit-dev
    branch: $TERMGIT_TRIGGER_BRANCH
    strategy: depend